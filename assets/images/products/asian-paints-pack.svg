<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="canBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="metalRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="apBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7b2fbf"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="445" rx="140" ry="20" fill="#0f172a" opacity="0.15"/>

  <!-- Main Paint Bucket Group -->
  <g filter="url(#softShadow)">
    <!-- Bucket Body -->
    <path d="M75,130 L95,410 Q200,435 305,410 L325,130 Z" fill="url(#canBodyGrad)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Branded Asian Paints Side Ribbon -->
    <path d="M75,130 L87,411 Q120,418 135,420 L130,130 Z" fill="#7b2fbf"/>
    <text x="275" y="-100" transform="rotate(90)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="4">asianpaints</text>

    <!-- Center Label Area -->
    <rect x="145" y="150" width="165" height="230" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- AP Logo Monogram -->
    <circle cx="227" cy="195" r="24" fill="url(#apBrandGrad)"/>
    <text x="227" y="203" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">ap</text>

    <!-- Brand Name Text -->
    <text x="227" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#0f172a" text-anchor="middle">asianpaints</text>

    <!-- Quality Seal -->
    <rect x="165" y="260" width="125" height="26" rx="13" fill="#fef2f2" stroke="#fecaca"/>
    <text x="227" y="277" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#dc2626" text-anchor="middle">ORIGINAL SEALED</text>

    <text x="227" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#475569" text-anchor="middle">Official Dealer Pack</text>
    <text x="227" y="335" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#94a3b8" text-anchor="middle">Photo Coming Soon</text>

    <!-- Top Metal Rim / Lid Structure -->
    <ellipse cx="200" cy="130" rx="125" ry="24" fill="url(#metalRimGrad)" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="200" cy="126" rx="112" ry="19" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="200" cy="124" rx="95" ry="14" fill="#e2e8f0"/>

    <!-- Handle Ear Bracket & Wire -->
    <circle cx="68" cy="165" r="8" fill="#64748b"/>
    <circle cx="332" cy="165" r="8" fill="#64748b"/>
    <path d="M68,165 C68,50 332,50 332,165" fill="none" stroke="url(#metalRimGrad)" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
