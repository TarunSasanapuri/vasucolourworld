<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- 3D Gradients -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="beretGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="antennaGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <radialGradient id="dropGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>

    <radialGradient id="earGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#090e24" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Antenna -->
    <rect x="61" y="10" width="6" height="20" rx="3" fill="url(#antennaGrad)"/>
    <!-- Glowing Paint Drop Tip -->
    <path d="M64 4 C60 10, 56 14, 56 18 A8 8 0 0 0 72 18 C72 14, 68 10, 64 4 Z" fill="url(#dropGlow)" filter="url(#glowFilter)"/>
    <circle cx="62" cy="16" r="2" fill="#ffffff" opacity="0.8"/>

    <!-- Ear / Headphone Units -->
    <!-- Left Ear -->
    <rect x="15" y="55" width="10" height="24" rx="5" fill="#475569"/>
    <rect x="12" y="58" width="6" height="18" rx="3" fill="url(#earGrad)"/>
    <!-- Right Ear -->
    <rect x="103" y="55" width="10" height="24" rx="5" fill="#475569"/>
    <rect x="110" y="58" width="6" height="18" rx="3" fill="url(#earGrad)"/>

    <!-- Headphone Band (under beret) -->
    <path d="M22 58 C22 30, 106 30, 106 58" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Main Robot Head Outer Shell -->
    <rect x="22" y="32" width="84" height="74" rx="34" fill="url(#headGrad)"/>
    <rect x="23" y="33" width="82" height="72" rx="33" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- Painter's Beret / Art Cap -->
    <path d="M30 42 C24 24, 76 14, 96 28 C106 35, 100 48, 86 46 C60 42, 42 46, 30 42 Z" fill="url(#beretGrad)"/>
    <!-- Beret Tip / Tab -->
    <circle cx="68" cy="22" r="3.5" fill="#e11d48"/>
    <!-- Colorful Paint Splash on Cap (Vasu palette dots) -->
    <circle cx="48" cy="34" r="3" fill="#ef4444"/>
    <circle cx="56" cy="31" r="3.2" fill="#f59e0b"/>
    <circle cx="64" cy="33" r="3" fill="#10b981"/>
    <circle cx="72" cy="32" r="3" fill="#06b6d4"/>

    <!-- Face Screen / Visor -->
    <rect x="30" y="46" width="68" height="46" rx="20" fill="url(#screenGrad)"/>
    <rect x="31" y="47" width="66" height="44" rx="19" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>

    <!-- Visor Gloss Highlight -->
    <path d="M36 50 C48 48, 80 48, 92 50 C86 56, 42 56, 36 50 Z" fill="#ffffff" opacity="0.18"/>

    <!-- Eyes (Friendly Glowing Cyan Arcs) -->
    <!-- Left Eye -->
    <path d="M42 66 C42 60, 52 60, 52 66" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#glowFilter)"/>
    <!-- Right Eye -->
    <path d="M76 66 C76 60, 86 60, 86 66" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#glowFilter)"/>

    <!-- Rosy Cheeks -->
    <circle cx="41" cy="74" r="4" fill="#fb7185" opacity="0.6"/>
    <circle cx="87" cy="74" r="4" fill="#fb7185" opacity="0.6"/>

    <!-- Friendly Smile -->
    <path d="M58 75 C60 80, 68 80, 70 75" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glowFilter)"/>

    <!-- Chin Metallic Bevel -->
    <ellipse cx="64" cy="98" rx="16" ry="3.5" fill="#94a3b8" opacity="0.7"/>

    <!-- Small Paint Swatch on Cheek / Face Border -->
    <circle cx="34" cy="80" r="2.5" fill="#f59e0b"/>
    <circle cx="94" cy="80" r="2.5" fill="#10b981"/>
  </g>
</svg>